services:
  postgres:
    image: postgres:16-alpine
    container_name: sm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_management
    ports:
      # Host 5433 avoids conflict with a local Windows PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - sm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sm_pg_data:
